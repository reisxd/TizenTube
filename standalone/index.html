<!DOCTYPE html>

<head>
    <style>
        @keyframes indeterminate-bar {
            0% {
                left: 0%;
                width: 0;
            }

            50% {
                left: 0%;
                width: 100%;
            }

            100% {
                left: 100%;
                width: 0;
            }
        }

        .progress-container {
            position: relative;
            width: 300px;
            height: 4px;
            margin-top: 40px;
            background-color: rgba(25, 118, 210, 0.3);
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            background-color: #1976D2;
            animation: indeterminate-bar 1.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }
    </style>
    <script>
        "use strict";
        tizen.tvinputdevice.registerKey("ColorF0Red");
        tizen.tvinputdevice.registerKey("ColorF1Green");
        tizen.tvinputdevice.registerKey("ColorF2Yellow");
        tizen.tvinputdevice.registerKey("ColorF3Blue");

        const keys = [
            "MediaPlayPause",
            "MediaPlay",
            "MediaPause",
            "MediaStop",
            "MediaFastForward",
            "MediaRewind",
            "MediaTrackNext",
            "MediaTrackPrevious"
        ];

        for (let i = 0; i < keys.length; i++) {
            tizen.tvinputdevice.registerKey(keys[i]);
        }

        const pkgId = tizen.application.getCurrentApplication().appInfo.packageId;

        const serviceId = pkgId + ".StandaloneService";

        let failed = false;
        let waitingSince = 0;
        let requestFailures = 0;
        let retryRequested = false;
        let serviceStatus = null;

        try {
            tizen.messageport.requestLocalMessagePort('TizenTubeStartup').addMessagePortListener(data => {
                const item = data.find(item => item.key === 'status');
                if (!item) return;
                try {
                    serviceStatus = JSON.parse(item.value);
                    if (serviceStatus.phase === 'error') {
                        showError('Service boot failed (' + serviceStatus.runtime + '): ' + serviceStatus.error);
                    }
                } catch (error) {
                    console.error('Invalid service startup status:', error);
                }
            });
        } catch (error) {
            console.error('Startup diagnostics unavailable:', error);
        }

        function showError(message) {
            failed = true;
            document.getElementById('startup-status').textContent = message + ' Press OK to retry.';
            document.querySelector('.progress-container').style.display = 'none';
        }

        function fetchJson(url) {
            return new Promise((resolve, reject) => {
                const timer = setTimeout(() => reject(new Error('The TizenTube service did not respond.')), 2500);
                fetch(url).then(response => {
                    if (!response.ok) throw new Error('The TizenTube service returned HTTP ' + response.status);
                    return response.json();
                }).then(value => {
                    clearTimeout(timer);
                    resolve(value);
                }).catch(error => {
                    clearTimeout(timer);
                    reject(error);
                });
            });
        }

        function useInjectorOrProxy() {
            if (serviceStatus && serviceStatus.phase === 'error') return;
            let args;
            try {
                const data = tizen.application.getCurrentApplication().getRequestedAppControl().appControl.data;
                const parsedData = JSON.parse(data[0].value[0]);
                args = parsedData.args;
            } catch (e) {
                // Do nothing.
            }
            fetchJson('http://localhost:8100/tizentube/getState')
                .then(res => {
                    if (serviceStatus && serviceStatus.phase === 'error') return;
                    requestFailures = 0;
                    if (!res.canConnectToDaemon) {
                        showError('Set Developer Mode Host PC IP to 127.0.0.1 and restart the TV.');
                    } else if (res.phase === 'error' && !retryRequested) {
                        showError(res.lastError || 'The TV debugger could not start.');
                    } else if (!res.isConnecting && (res.phase !== 'running' || retryRequested)) {
                        retryRequested = false;
                        fetchJson(`http://localhost:8100/tizentube/debugger${args ? `?${args}` : ''}`)
                            .then(() => {
                                if (!serviceStatus || serviceStatus.phase !== 'error') tizen.application.getCurrentApplication().exit();
                            })
                            .catch(error => {
                                if (!serviceStatus || serviceStatus.phase !== 'error') showError(error.message);
                            });
                    } else if (Date.now() - waitingSince < 65000) {
                        setTimeout(useInjectorOrProxy, 500);
                    } else showError('Timed out while starting TizenTube.');
                }).catch(() => {
                    if (serviceStatus && serviceStatus.phase === 'error') return;
                    if (++requestFailures < 20) setTimeout(useInjectorOrProxy, 500);
                    else showError('The TizenTube service did not respond. Startup: ' +
                        (serviceStatus ? serviceStatus.phase + ' (' + serviceStatus.runtime + ')' : 'no lifecycle callback received'));
                });
        }

        function start() {
            failed = false;
            waitingSince = Date.now();
            requestFailures = 0;
            document.getElementById('startup-status').textContent = '';
            document.querySelector('.progress-container').style.display = '';
            tizen.application.launchAppControl(
                new tizen.ApplicationControl("http://tizen.org/appcontrol/operation/service"),
                serviceId,
                useInjectorOrProxy,
                error => {
                    if (!serviceStatus || serviceStatus.phase !== 'error') showError('Launch service failed: ' + error.message);
                }
            );
        }

        window.addEventListener('DOMContentLoaded', start);
        window.addEventListener('keydown', event => {
            if (failed && event.keyCode === 13) {
                retryRequested = true;
                start();
            }
        });
    </script>
</head>

<body
    style="background-color: #0f0f0f; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0;">
    <h1
        style="color: #FFFFFF; font-size: 80px; font-family: Roboto,Noto Sans CJK ZH-HK,Noto Sans Thai,Arial,Helvetica,sans-serif; margin: 0;">
        TizenTube
    </h1>
    <div class="progress-container">
        <div class="progress-bar"></div>
    </div>
    <p id="startup-status" role="status" style="color: #ddd; max-width: 900px; font: 24px Arial; text-align: center;"></p>
</body>

</html>
