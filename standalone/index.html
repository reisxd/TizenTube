<!DOCTYPE html>

<head>
    <style>
        @keyframes indeterminate-bar {
            0% {
                left: 0%;
                width: 0;
            }

            50% {
                left: 0%;
                width: 100%;
            }

            100% {
                left: 100%;
                width: 0;
            }
        }

        .progress-container {
            position: relative;
            width: 300px;
            height: 4px;
            margin-top: 40px;
            background-color: rgba(25, 118, 210, 0.3);
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            background-color: #1976D2;
            animation: indeterminate-bar 1.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }
    </style>
    <script>
        "use strict";
        tizen.tvinputdevice.registerKey("ColorF0Red");
        tizen.tvinputdevice.registerKey("ColorF1Green");
        tizen.tvinputdevice.registerKey("ColorF2Yellow");
        tizen.tvinputdevice.registerKey("ColorF3Blue");

        const keys = [
            "MediaPlayPause",
            "MediaPlay",
            "MediaPause",
            "MediaStop",
            "MediaFastForward",
            "MediaRewind",
            "MediaTrackNext",
            "MediaTrackPrevious"
        ];

        for (let i = 0; i < keys.length; i++) {
            tizen.tvinputdevice.registerKey(keys[i]);
        }

        const pkgId = tizen.application.getCurrentApplication().appInfo.packageId;

        const serviceId = pkgId + ".StandaloneService";

        function useInjectorOrProxy() {
            const data = tizen.application.getCurrentApplication().getRequestedAppControl().appControl.data;
            let args;
            try {
                const parsedData = JSON.parse(data[0].value[0]);
                args = parsedData.args;
            } catch (e) {
                // Do nothing.
            }
            fetch('http://localhost:8100/tizentube/getState')
                .then(r => r.json())
                .then(res => {
                    if (res.isDebuggerAttached) {
                        // Relaunched in debug mode with the injector attached. The service's own
                        // Page.navigate can be lost while this page is still loading, so navigate here;
                        // the userscript is injected into every new execution context.
                        location.href = `https://youtube.com/tv?additionalDataUrl=http%3A%2F%2Flocalhost%3A8085%2Fdial%2Fapps%2FYouTube${args ? `&${args}` : ''}`;
                    } else if (res.canConnectToDaemon && !res.isConnecting) {
                        fetch(`http://localhost:8100/tizentube/debugger${args ? `?${args}` : ''}`);
                        tizen.application.getCurrentApplication().exit();
                    } else if (!res.canConnectToDaemon) {
                        location.href = `http://localhost:8100/tv?additionalDataUrl=http%3A%2F%2Flocalhost%3A8100%2Fdial%2Fapps%2FYouTube${args ? `&${args}` : ''}`
                    } else {
                        // The service is still attaching the debugger.
                        setTimeout(useInjectorOrProxy, 1000);
                    }
                }).catch(() => window.location.reload());
        }

        // On a cold start (e.g. Tizen 5.0) the service can take longer to come up than the platform's
        // launch timeout, which then reports "Unknown error" although the service does start.
        // Keep polling it for a while instead of giving up.
        const serviceWaitMs = 60000;
        const serviceDeadline = Date.now() + serviceWaitMs;
        let serviceReady = false;

        function onServiceReady() {
            if (serviceReady) return;
            serviceReady = true;
            useInjectorOrProxy();
        }

        function waitForService(launchError) {
            if (serviceReady) return;
            fetch('http://localhost:8100/tizentube/getState')
                .then(() => onServiceReady())
                .catch(() => {
                    if (Date.now() < serviceDeadline) setTimeout(() => waitForService(launchError), 1000);
                    else alert("Launch Service failed: " + (launchError || "the service did not respond"));
                });
        }

        tizen.application.launchAppControl(
            new tizen.ApplicationControl("http://tizen.org/appcontrol/operation/service"),
            serviceId,
            function () {
                onServiceReady();
            },
            function (e) {
                waitForService(e.message);
            }
        );

        // The launch callback may also never fire while the service is starting.
        setTimeout(() => waitForService(), 2000);
    </script>
</head>

<body
    style="background-color: #0f0f0f; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0;">
    <h1
        style="color: #FFFFFF; font-size: 80px; font-family: Roboto,Noto Sans CJK ZH-HK,Noto Sans Thai,Arial,Helvetica,sans-serif; margin: 0;">
        TizenTube
    </h1>
    <div class="progress-container">
        <div class="progress-bar"></div>
    </div>
</body>

</html>
