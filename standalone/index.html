<!DOCTYPE html>

<head>
    <style>
        @keyframes indeterminate-bar {
            0% {
                left: 0%;
                width: 0;
            }

            50% {
                left: 0%;
                width: 100%;
            }

            100% {
                left: 100%;
                width: 0;
            }
        }

        .progress-container {
            position: relative;
            width: 300px;
            height: 4px;
            margin-top: 40px;
            background-color: rgba(25, 118, 210, 0.3);
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            background-color: #1976D2;
            animation: indeterminate-bar 1.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }
    </style>
    <script>
        "use strict";
        tizen.tvinputdevice.registerKey("ColorF0Red");
        tizen.tvinputdevice.registerKey("ColorF1Green");
        tizen.tvinputdevice.registerKey("ColorF2Yellow");
        tizen.tvinputdevice.registerKey("ColorF3Blue");

        const keys = [
            "MediaPlayPause",
            "MediaPlay",
            "MediaPause",
            "MediaStop",
            "MediaFastForward",
            "MediaRewind",
            "MediaTrackNext",
            "MediaTrackPrevious"
        ];

        for (let i = 0; i < keys.length; i++) {
            tizen.tvinputdevice.registerKey(keys[i]);
        }

        const pkgId = tizen.application.getCurrentApplication().appInfo.packageId;

        const serviceId = pkgId + ".StandaloneService";

        // The service on :8100 is retried by reloading (which also relaunches the service),
        // but throttled and capped so a TV that can't run it shows why instead of looping forever.
        const MAX_ATTEMPTS = 30;
        let attempt = 0;
        try {
            attempt = Number(sessionStorage.getItem("serviceAttempt") || 0);
        } catch (e) {
            // Do nothing.
        }

        function showError(message) {
            const render = () => {
                document.querySelector(".progress-container").style.display = "none";
                const p = document.createElement("p");
                p.style.cssText = "color: #FFFFFF; font-size: 32px; font-family: Roboto,Arial,sans-serif; max-width: 1400px; text-align: center; white-space: pre-line;";
                p.textContent = message + "\n\nPress OK to try again.";
                document.body.appendChild(p);
            };
            if (document.body) render(); else document.addEventListener("DOMContentLoaded", render);
            document.addEventListener("keydown", e => {
                if (e.keyCode === 13) retryLater(0);
            });
        }

        function serviceSupported() {
            try {
                return tizen.systeminfo.getCapability("http://tizen.org/feature/web.service");
            } catch (e) {
                return "unknown";
            }
        }

        function retryLater(delay) {
            try {
                sessionStorage.setItem("serviceAttempt", String(delay === 0 ? 0 : attempt + 1));
            } catch (e) {
                // Do nothing.
            }
            setTimeout(() => window.location.reload(), delay);
        }

        function onServiceUnreachable() {
            if (attempt < MAX_ATTEMPTS) return retryLater(1000);
            try {
                sessionStorage.removeItem("serviceAttempt");
            } catch (e) {
                // Do nothing.
            }
            const supported = serviceSupported();
            showError(supported === false
                ? "The TizenTube service could not be started.\nThis TV reports that it does not support Tizen web services (web.service = false), which TizenTube needs."
                : "The TizenTube service did not respond on port 8100.\nTry restarting the TV, or reinstall TizenTube.");
        }

        function useInjectorOrProxy() {
            const data = tizen.application.getCurrentApplication().getRequestedAppControl().appControl.data;
            let args;
            try {
                const parsedData = JSON.parse(data[0].value[0]);
                args = parsedData.args;
            } catch (e) {
                // Do nothing.
            }
            fetch('http://localhost:8100/tizentube/getState')
                .then(r => r.json())
                .then(res => {
                    try {
                        sessionStorage.removeItem("serviceAttempt");
                    } catch (e) {
                        // Do nothing.
                    }
                    if (res.canConnectToDaemon && !res.isConnecting) {
                        fetch(`http://localhost:8100/tizentube/debugger${args ? `?${args}` : ''}`);
                        tizen.application.getCurrentApplication().exit();
                    } else if (!res.canConnectToDaemon) location.href = `http://localhost:8100/tv?additionalDataUrl=http%3A%2F%2Flocalhost%3A8100%2Fdial%2Fapps%2FYouTube${args ? `&${args}` : ''}`
                }).catch(onServiceUnreachable);
        }

        tizen.application.launchAppControl(
            new tizen.ApplicationControl("http://tizen.org/appcontrol/operation/service"),
            serviceId,
            function () {
                useInjectorOrProxy();
            },
            function (e) {
                alert("Launch Service failed: " + e.message);
            }
        );
    </script>
</head>

<body
    style="background-color: #0f0f0f; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0;">
    <h1
        style="color: #FFFFFF; font-size: 80px; font-family: Roboto,Noto Sans CJK ZH-HK,Noto Sans Thai,Arial,Helvetica,sans-serif; margin: 0;">
        TizenTube
    </h1>
    <div class="progress-container">
        <div class="progress-bar"></div>
    </div>
</body>

</html>
